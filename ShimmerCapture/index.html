<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shimmer Capture has moved</title>

    <!--
      Shimmer Capture moved to its own repository:
      https://github.com/ShimmerResearch/shimmer-capture-web

      This stub keeps the published URL working. GitHub Pages serves static
      files and cannot issue a 301, so the redirect is done three ways, each
      covering a case the others do not:

        - <meta http-equiv="refresh"> works with JavaScript disabled;
        - location.replace() runs sooner AND replaces the history entry, so
          Back returns to wherever the visitor came from instead of bouncing
          them forward again;
        - the visible link below is what is left if both are blocked.

      <link rel="canonical"> is the part that matters beyond today: it tells
      search engines the new URL is the real one, so the old result is
      eventually replaced rather than competing with it.

      The query string and fragment are carried across, because ?mock=1 is how
      the page is demonstrated without hardware and such links are in
      circulation.

      Do not delete this file to tidy up. Every link to Shimmer Capture
      published before the split points here.
    -->
    <link
      rel="canonical"
      href="https://shimmerresearch.github.io/shimmer-capture-web/"
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://shimmerresearch.github.io/shimmer-capture-web/"
    />
    <meta name="robots" content="noindex, follow" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23fe5000'/%3E%3Cpath d='M2 10.5 L5 10.5 L6.5 5.5 L8 12 L9.5 8 L11 10.5 L14 10.5' fill='none' stroke='white' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <script>
      (function () {
        var to = "https://shimmerresearch.github.io/shimmer-capture-web/";
        // Carry ?mock=1 and any fragment across, so circulated links keep working.
        location.replace(to + location.search + location.hash);
      })();
    </script>

    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f4f6f8;
        color: #1f2328;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      a {
        color: #c94000;
      }
      .go {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.6rem 1.1rem;
        border-radius: 6px;
        background: #fe5000;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d1117;
          color: #e6edf3;
        }
        a {
          color: #ff7a3d;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shimmer Capture has moved</h1>
      <p>
        It now lives at
        <a href="https://shimmerresearch.github.io/shimmer-capture-web/"
          >shimmerresearch.github.io/shimmer-capture-web</a
        >, built from
        <a href="https://github.com/ShimmerResearch/shimmer-capture-web"
          >ShimmerResearch/shimmer-capture-web</a
        >.
      </p>
      <p>You should be redirected automatically. If not:</p>
      <p>
        <a
          class="go"
          href="https://shimmerresearch.github.io/shimmer-capture-web/"
          >Go to Shimmer Capture</a
        >
      </p>
    </main>
  </body>
</html>
