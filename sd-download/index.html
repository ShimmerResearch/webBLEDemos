<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shimmer3R SD Download</title>
    <style>
      :root {
        --bg: #101418;
        --panel: #1a2026;
        --border: #2c343c;
        --text: #e8ecef;
        --muted: #9aa5ad;
        --accent: #fe5000;
        --accent-fill: #cf3f00;
        --ok: #3fb950;
        --err: #f85149;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      main {
        padding: 16px 20px;
        display: grid;
        gap: 16px;
        max-width: 1100px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
      }
      section h2 {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      button {
        background: var(--accent-fill);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 7px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      button.danger {
        background: #7d1a1a;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .banner {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        display: none;
      }
      .banner.err {
        display: block;
        background: #3a1214;
        color: var(--err);
        border: 1px solid #5c1e21;
      }
      .banner.info {
        display: block;
        background: #14202c;
        color: #9ec4e8;
        border: 1px solid #24425e;
      }
      .banner.ok {
        display: block;
        background: #12291a;
        color: var(--ok);
        border: 1px solid #1e4429;
      }
      #tree {
        font-family: Consolas, monospace;
        font-size: 13px;
        line-height: 1.7;
        max-height: 420px;
        overflow: auto;
      }
      #tree ul {
        list-style: none;
        margin: 0;
        padding-left: 22px;
      }
      #tree label {
        cursor: pointer;
      }
      #tree .size {
        color: var(--muted);
        margin-left: 8px;
      }
      progress {
        width: 100%;
        height: 14px;
        accent-color: var(--accent);
      }
      #log {
        font-family: Consolas, monospace;
        font-size: 12px;
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        color: var(--muted);
      }
      .statgrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 12px;
      }
      .stat b {
        display: block;
        font-size: 17px;
      }
      .stat span {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Shimmer3R SD Download</h1>
      <button id="btnConnect">Connect BLE</button>
      <button
        id="btnConnectBt"
        class="secondary"
        title="Requires the sensor to be paired with this host over classic Bluetooth"
      >
        Connect Classic Bluetooth
      </button>
      <button id="btnDisconnect" class="secondary" disabled>Disconnect</button>
      <span id="connState" class="muted">Not connected</span>
    </header>
    <main>
      <div id="fwBanner" class="banner"></div>

      <section>
        <h2>Card</h2>
        <div class="statgrid">
          <div class="stat">
            <b id="statFree">–</b><span>free on card</span>
          </div>
          <div class="stat">
            <b id="statTotal">–</b><span>card capacity</span>
          </div>
          <div class="stat">
            <b id="statFiles">–</b><span>files under data/</span>
          </div>
          <div class="stat">
            <b id="statBytes">–</b><span>total data size</span>
          </div>
          <div class="stat">
            <b id="statLink">–</b><span>measured link speed</span>
          </div>
        </div>
        <div class="row">
          <button id="btnRefresh" class="secondary" disabled>
            Refresh card contents
          </button>
          <button id="btnLinkTest" class="secondary" disabled>
            Measure link speed (5 s)
          </button>
          <span id="treeState" class="muted"></span>
        </div>
        <div id="tree"></div>
      </section>

      <section>
        <h2>Download</h2>
        <div class="row">
          <label class="muted" for="layoutSelect">Folder layout</label>
          <select id="layoutSelect">
            <option value="consensysBackup" selected>
              Consensys Backup (importable)
            </option>
            <option value="card">Mirror SD card structure</option>
          </select>
        </div>
        <div class="banner info" id="pathHint"></div>
        <div class="row">
          <button id="btnPickDest" class="secondary" disabled>
            Choose destination folder…
          </button>
          <span id="destLabel" class="muted">No folder selected</span>
        </div>
        <div class="row muted" id="destPreview"></div>
        <div class="row">
          <label class="muted"
            ><input type="checkbox" id="chkDelete" checked /> Delete from card
            after verified download</label
          >
        </div>
        <div class="row">
          <button id="btnDownloadSel" disabled>Download selected</button>
          <button id="btnDownloadAll" disabled>Download all</button>
          <button id="btnAbort" class="danger" disabled>Abort</button>
        </div>
        <div class="row">
          <progress id="progTotal" max="100" value="0"></progress>
        </div>
        <div class="row muted" id="progLabel">Idle</div>
        <div class="row muted" id="fileLabel"></div>
      </section>

      <section>
        <h2>Log</h2>
        <div id="log"></div>
      </section>
    </main>

    <script type="module">
      import {
        Shimmer3RClient,
        WebSerialTransport,
        SHIMMER3_SPP_SERIAL_OPTIONS,
        describePlatformSupport,
        transportAdvice,
        enumerateSdTree,
        downloadSdTree,
        formatSdImportStamp,
        SdTransferError,
      } from "../shimmer-extension/vendor/shimmer-web-sdk.esm.js";

      const $ = (id) => document.getElementById(id);

      /* Snapshotted once, up here, for two reasons: setConnected() consults it on
       * every disconnect (see below), and it is referenced before the guidance
       * block at the bottom of this script runs - a const declared down there
       * would be in its temporal dead zone. */
      const support = describePlatformSupport();
      const logEl = $("log");

      function log(msg, isErr = false) {
        const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.textContent += line + "\n";
        logEl.scrollTop = logEl.scrollHeight;
        (isErr ? console.error : console.log)(line);
      }

      function fmtBytes(n) {
        if (n == null) return "–";
        if (n < 1024) return `${n} B`;
        if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
        if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
        return `${(n / 1024 / 1024 / 1024).toFixed(2)} GB`;
      }

      // Windows is the only platform where the Consensys workspace has a
      // predictable location worth suggesting. What keeps mobile out of this UI
      // is showDirectoryPicker, which is Chromium-desktop only - not the link
      // layer: Android Chrome has both Web Bluetooth and (for RFCOMM) Web
      // Serial, and on iOS a bundled-stack browser like Bluefy can run this page
      // over BLE. Either way there is no destination folder to pick.
      const IS_WINDOWS = /Windows/i.test(
        navigator.userAgentData?.platform || navigator.userAgent,
      );

      const CONSENSYS_BACKUP_HINT =
        String.raw`Tip: choose %USERPROFILE%\Shimmer_Workspace\Backup so Consensys can ` +
        "import this directly (Application Settings → Manage Data → Import Data " +
        "From Backup Directory). The folder is remembered for next time.";

      // The picked folder handle is persisted so the user only chooses once;
      // browsers never expose the absolute path, so remembering the handle is
      // the only way to avoid re-picking.
      const DB_NAME = "shimmer-sd-download";
      const DB_STORE = "handles";
      const DEST_KEY = "destRoot";

      function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function rememberDest(handle) {
        try {
          const db = await openDb();
          await new Promise((res, rej) => {
            const tx = db.transaction(DB_STORE, "readwrite");
            tx.objectStore(DB_STORE).put(handle, DEST_KEY);
            tx.oncomplete = res;
            tx.onerror = () => rej(tx.error);
          });
          db.close();
        } catch (e) {
          log(`Could not remember destination folder: ${e.message}`, true);
        }
      }

      async function recallDest() {
        try {
          const db = await openDb();
          const handle = await new Promise((res, rej) => {
            const tx = db.transaction(DB_STORE, "readonly");
            const r = tx.objectStore(DB_STORE).get(DEST_KEY);
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          });
          db.close();
          return handle ?? null;
        } catch {
          return null;
        }
      }

      /** Re-grant write access if needed. Must be called from a user gesture. */
      async function ensureWritable(handle) {
        const opts = { mode: "readwrite" };
        if ((await handle.queryPermission(opts)) === "granted") return true;
        return (await handle.requestPermission(opts)) === "granted";
      }

      let client = null;
      let destRoot = null;
      let tree = null;
      let abortCtl = null;
      let sdSupported = false;
      let linkTesting = false;

      function setConnected(connected) {
        /* Capability is a floor the connected-state cannot lift. Assigning
         * `disabled = connected` alone re-enabled both buttons on every
         * disconnect, so on a browser with only one of the two APIs - desktop
         * Firefox has Web Serial but no Web Bluetooth - one connect/disconnect
         * cycle handed the user a button that cannot work. */
        $("btnConnect").disabled = connected || !support.webBluetooth;
        $("btnConnectBt").disabled = connected || !support.webSerial;
        $("btnDisconnect").disabled = !connected;
        updateDownloadButtons();
        $("connState").textContent = connected ? "Connected" : "Not connected";
        if (!connected) {
          $("fwBanner").className = "banner";
          $("tree").innerHTML = "";
          tree = null;
          sdSupported = false;
        }
      }

      function updateDownloadButtons() {
        const busy = abortCtl !== null || linkTesting;
        const usable = client && sdSupported && !busy;
        const ready = usable && destRoot && tree;
        $("btnDownloadSel").disabled = !ready || selectedPaths().length === 0;
        $("btnDownloadAll").disabled = !ready;
        $("btnAbort").disabled = abortCtl === null;
        $("btnRefresh").disabled = !usable;
        $("btnPickDest").disabled = !usable;
        $("btnLinkTest").disabled = !client || busy;
      }

      function selectedLayout() {
        return $("layoutSelect").value;
      }

      function refreshDestPreview() {
        if (!destRoot) {
          $("destPreview").textContent = "";
          return;
        }
        const stamp = formatSdImportStamp();
        $("destPreview").textContent =
          selectedLayout() === "consensysBackup"
            ? `Files will be written to ${destRoot.name}/${stamp}/<ShimmerName>/data/…`
            : `Files will be written to ${destRoot.name}/data/…`;
      }

      function setDestLabel(remembered) {
        $("destLabel").textContent = destRoot
          ? `Saving into: ${destRoot.name}${remembered ? " (remembered)" : ""}`
          : "No folder selected";
        refreshDestPreview();
      }

      $("layoutSelect").onchange = refreshDestPreview;

      function fmtEta(seconds) {
        if (!isFinite(seconds) || seconds < 0) return "–";
        const m = Math.floor(seconds / 60);
        const s = Math.round(seconds % 60);
        return m ? `${m}m ${String(s).padStart(2, "0")}s` : `${s}s`;
      }

      $("btnLinkTest").onclick = async () => {
        linkTesting = true;
        updateDownloadButtons();
        log("Measuring raw link speed (5 s, firmware data-rate test)…");
        try {
          const res = await client.runDataRateTest(5000, (bytes, elapsedMs) => {
            $("statLink").textContent =
              `${(bytes / 1024 / (elapsedMs / 1000)).toFixed(1)} KB/s`;
          });
          $("statLink").textContent = `${res.kBps.toFixed(1)} KB/s`;
          log(
            `Raw link speed: ${res.kBps.toFixed(1)} KB/s (${fmtBytes(res.bytesReceived)} in ${(res.durationMs / 1000).toFixed(1)}s).`,
          );
          log(
            `As a guide (file transfer adds ~2% framing overhead): ` +
              `1 MB ≈ ${fmtEta((1 * 1024) / res.kBps)}, ` +
              `5 MB ≈ ${fmtEta((5 * 1024) / res.kBps)}, ` +
              `20 MB ≈ ${fmtEta((20 * 1024) / res.kBps)}.`,
          );
          if (tree && tree.totalBytes > 0) {
            log(
              `Everything currently on this card (${fmtBytes(tree.totalBytes)}) ≈ ${fmtEta(tree.totalBytes / 1024 / res.kBps)}.`,
            );
          }
        } catch (e) {
          log(`Link speed test failed: ${e.message}`, true);
        } finally {
          linkTesting = false;
          updateDownloadButtons();
        }
      };

      /**
       * Connect over `linkName`, then identify the firmware and read the card.
       * `makeClient` builds the client so the two buttons differ only in which
       * transport they hand over.
       */
      async function connectVia(linkName, makeClient) {
        try {
          client = makeClient();
          client.onStatus = (s) => log(s);
          log(`connecting over ${linkName}…`);
          await client.connect();
          setConnected(true);

          sdSupported = await client.supportsSdTransfer();
          const v = await client.readFwVersion().catch(() => null);
          const banner = $("fwBanner");

          /* No version at all means the sensor never answered — the link is open
           * but nothing is talking. Reporting that as "firmware unknown does not
           * support SD file transfer" would send you looking for a firmware
           * problem that isn't there, so it gets its own message. */
          if (!v) {
            banner.className = "banner err";
            banner.textContent =
              "Connected, but the sensor did not answer the firmware-version query.";
            log(
              "no reply to GET_FW_VERSION — link open, sensor not responding",
              true,
            );
            for (const hint of connectFailureHints(
              linkName,
              new Error("timeout"),
            )) {
              log(hint, true);
            }
            updateDownloadButtons();
            return;
          }

          const verStr = `v${v.major}.${String(v.minor).padStart(2, "0")}.${String(v.patch).padStart(3, "0")}`;
          if (!sdSupported) {
            banner.className = "banner err";
            banner.textContent = `Firmware ${verStr} cannot transfer SD files intact (needs LogAndStream_Shimmer3R v1.01.011 or later; v1.01.009 and v1.01.010 corrupt downloaded data).`;
            updateDownloadButtons();
            return;
          }
          updateDownloadButtons();
          banner.className = "banner ok";
          banner.textContent = `Firmware ${verStr} — SD file transfer supported.`;

          try {
            const space = await client.sdGetFreeSpace();
            $("statFree").textContent = fmtBytes(space.freeKB * 1024);
            $("statTotal").textContent = fmtBytes(space.totalKB * 1024);
          } catch (e) {
            log(`Free-space query failed: ${e.message}`, true);
          }
          await refreshTree();
        } catch (e) {
          /* Release the link before dropping the reference. If connect() rejected
           * after the port opened, WebSerialTransport leaves the COM port open,
           * and a port nothing references can never be closed - the next attempt
           * then fails with "port already open" until the page is reloaded. */
          try {
            await client?.disconnect();
          } catch {
            /* already down */
          }
          log(`Connect failed over ${linkName}: ${e.message}`, true);
          for (const hint of connectFailureHints(linkName, e)) log(hint, true);
          setConnected(false);
          client = null;
        }
      }

      /**
       * Extra guidance for a failed connect. The Web Serial picker is drawn by
       * the browser and cannot be filtered by device name — the API only filters
       * on USB VID/PID or Bluetooth service class, and a port's name is not even
       * readable via getInfo(). So when the wrong entry is picked, the best we
       * can do is explain the symptom afterwards.
       */
      function connectFailureHints(linkName, e) {
        if (linkName !== "classic Bluetooth") return [];
        const hints = [];
        if (/timeout/i.test(e.message)) {
          /* A Shimmer3R pairs as two separate Bluetooth entries: "…-BT"
           * (classic, speaks this protocol) and "…-BLE" (GATT, does not). The
           * SPP service-class filter should keep the BLE one out of the picker,
           * but if it appears anyway, opening it succeeds and then nothing ever
           * answers — which looks exactly like this. */
          hints.push(
            'the port opened but the sensor never answered — if you picked a "…-BLE" entry, choose the "…-BT" one instead (or use Connect BLE)',
          );
        }
        hints.push(
          "also check the sensor is paired with this host, powered, in range, and not held open by another app (e.g. Consensys)",
        );
        return hints;
      }

      $("btnConnect").onclick = () =>
        connectVia("BLE", () => new Shimmer3RClient({ debug: false }));

      /* Classic Bluetooth. A Shimmer paired over classic BT appears to Windows
       * as a COM port, which Web Serial can open — the same LiteProtocol, over
       * RFCOMM instead of GATT. Worth a button here above all for throughput:
       * classic BT is not bound by BLE's connection interval and MTU, and the
       * "Measure link speed" button above gives a direct A/B against BLE.
       *
       * The client re-frames the byte stream itself (an unframed transport
       * reports capabilities.framed === false), so nothing else changes. */
      $("btnConnectBt").onclick = () =>
        connectVia(
          "classic Bluetooth",
          () =>
            new Shimmer3RClient({
              debug: false,
              transport: new WebSerialTransport({
                ...SHIMMER3_SPP_SERIAL_OPTIONS,
                /* Bulk transfer: a generous read buffer keeps a slow turn of the
                 * read loop from stalling the sender. */
                bufferSize: 64 * 1024,
              }),
            }),
        );

      $("btnDisconnect").onclick = async () => {
        try {
          abortCtl?.abort();
        } catch {}
        try {
          await client?.disconnect();
        } catch {}
        client = null;
        setConnected(false);
      };

      async function refreshTree() {
        $("treeState").textContent = "Listing card…";
        try {
          tree = await enumerateSdTree(client, "data");
          renderTree();
          $("statFiles").textContent = String(tree.files.length);
          $("statBytes").textContent = fmtBytes(tree.totalBytes);
          $("treeState").textContent = "";
        } catch (e) {
          tree = null;
          $("tree").innerHTML = "";
          $("treeState").textContent =
            e instanceof SdTransferError
              ? `Cannot list card: ${e.message}`
              : `Listing failed: ${e.message}`;
          log($("treeState").textContent, true);
        }
        updateDownloadButtons();
      }
      $("btnRefresh").onclick = refreshTree;

      /** Group files by their session directory for a compact selectable tree. */
      function renderTree() {
        const container = $("tree");
        container.innerHTML = "";
        const bySession = new Map();
        for (const f of tree.files) {
          const dir = f.path.slice(0, f.path.lastIndexOf("/"));
          if (!bySession.has(dir)) bySession.set(dir, { files: [], bytes: 0 });
          const s = bySession.get(dir);
          s.files.push(f);
          s.bytes += f.size;
        }
        const ul = document.createElement("ul");
        for (const [dir, info] of bySession) {
          const li = document.createElement("li");
          const label = document.createElement("label");
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.dataset.path = dir;
          cb.onchange = updateDownloadButtons;
          label.append(cb, ` ${dir}`);
          const size = document.createElement("span");
          size.className = "size";
          size.textContent = `${info.files.length} file(s), ${fmtBytes(info.bytes)}`;
          li.append(label, size);
          ul.append(li);
        }
        if (!bySession.size) {
          const li = document.createElement("li");
          li.textContent = "No data files on card.";
          ul.append(li);
        }
        container.append(ul);
      }

      function selectedPaths() {
        return Array.from(document.querySelectorAll("#tree input:checked")).map(
          (c) => c.dataset.path,
        );
      }

      $("btnPickDest").onclick = async () => {
        if (!("showDirectoryPicker" in window)) {
          log(
            "File System Access API unavailable in this browser — cannot pick a destination folder.",
            true,
          );
          return;
        }
        try {
          // `id` makes the browser reopen in the same place next time; an
          // absolute path cannot be supplied, so a previously-picked handle is
          // the closest thing to a default location.
          destRoot = await window.showDirectoryPicker({
            mode: "readwrite",
            id: "shimmer-consensys-backup",
            startIn: destRoot ?? undefined,
          });
          setDestLabel(false);
          await rememberDest(destRoot);
        } catch {
          /* user cancelled */
        }
        updateDownloadButtons();
      };

      async function runDownload(rootPaths) {
        const deleteAfterVerify = $("chkDelete").checked;
        if (deleteAfterVerify) {
          // Deleting is the default, so state the scope rather than showing a
          // generic warning that is easy to click through. Counts come from the
          // last card listing; only files verified on this host are deleted.
          const doomed = (tree?.files ?? []).filter((f) =>
            rootPaths.some((r) => f.path === r || f.path.startsWith(r + "/")),
          );
          const sessions = new Set(
            doomed.map((f) => f.path.slice(0, f.path.lastIndexOf("/"))),
          );
          const doomedBytes = doomed.reduce((n, f) => n + f.size, 0);
          const ok = confirm(
            "After each file is downloaded and verified it will be DELETED " +
              "from the SD card.\n\nAbout to transfer, then delete:\n" +
              `  ${doomed.length} file(s), ${fmtBytes(doomedBytes)}\n` +
              `  ${sessions.size} session folder(s)\n\n` +
              'Untick "Delete from card after verified download" to keep the ' +
              "data on the card.\n\nContinue?",
          );
          if (!ok) return;
        }
        // A remembered handle may need write access re-granted; this runs
        // inside the click gesture, which is when the browser allows it.
        if (!(await ensureWritable(destRoot))) {
          log("Write access to the destination folder was not granted.", true);
          return;
        }
        // One import folder for the whole run, so selecting several sessions
        // still produces a single Consensys import.
        const layout = selectedLayout();
        const importStamp = formatSdImportStamp();
        if (layout === "consensysBackup") {
          log(`Writing Consensys import folder ${importStamp}/`);
        }
        abortCtl = new AbortController();
        updateDownloadButtons();
        $("progTotal").max = 100;
        $("progTotal").value = 0;
        $("progLabel").textContent = "Listing card…";
        $("fileLabel").textContent = "";
        const startedAt = Date.now();
        let downloaded = 0,
          skipped = 0,
          failed = 0,
          bytes = 0;

        // Rolling throughput over the last ~5 s of progress events; returns null
        // (no rate shown) when there is no recent sample pair to compute from
        const samples = [];
        const rollingRate = (bytesDone) => {
          const now = Date.now();
          samples.push({ t: now, b: bytesDone });
          while (samples.length >= 2 && now - samples[0].t > 5000)
            samples.shift();
          if (samples.length < 2) return null;
          const dt = (now - samples[0].t) / 1000;
          return dt > 0.5 ? (bytesDone - samples[0].b) / 1024 / dt : null;
        };

        try {
          for (const root of rootPaths) {
            log(`Downloading ${root}…`);
            const summary = await downloadSdTree(client, destRoot, {
              rootPath: root,
              deleteAfterVerify,
              layout,
              importStamp,
              signal: abortCtl.signal,
              onProgress: (p) => {
                if (p.bytesTotal > 0) {
                  $("progTotal").max = p.bytesTotal;
                  $("progTotal").value = p.bytesDone;
                }
                const rate =
                  p.phase === "download" ? rollingRate(p.bytesDone) : null;
                const eta = rate
                  ? fmtEta((p.bytesTotal - p.bytesDone) / 1024 / rate)
                  : "–";
                $("progLabel").textContent =
                  `${p.phase}: ${p.filesDone}/${p.filesTotal} files, ` +
                  `${fmtBytes(p.bytesDone)} / ${fmtBytes(p.bytesTotal)}` +
                  (rate ? ` @ ${rate.toFixed(1)} KB/s, ETA ${eta}` : "");
                $("fileLabel").textContent = p.currentFile
                  ? `${p.currentFile} (${fmtBytes(p.fileBytesDone)} / ${fmtBytes(p.fileBytesTotal)})`
                  : "";
              },
            });
            downloaded += summary.filesDownloaded;
            skipped += summary.filesSkipped;
            failed += summary.filesFailed.length;
            bytes += summary.bytesDownloaded;
            for (const f of summary.filesFailed)
              log(`FAILED ${f.path}: ${f.error}`, true);
            for (const d of summary.deletedFromCard)
              log(`Deleted from card: ${d}`);
          }
          const elapsedS = (Date.now() - startedAt) / 1000;
          const avg =
            bytes > 0 && elapsedS > 0
              ? ` (avg ${(bytes / 1024 / elapsedS).toFixed(1)} KB/s)`
              : "";
          log(
            `Done in ${elapsedS.toFixed(1)}s — ${downloaded} downloaded, ${skipped} already up to date, ${failed} failed, ${fmtBytes(bytes)} transferred${avg}.`,
          );
          $("progLabel").textContent = "Done";
          $("fileLabel").textContent = "";
          await refreshTree();
        } catch (e) {
          if (e.name === "AbortError") {
            log("Download aborted. Re-run to resume from where it stopped.");
            $("progLabel").textContent = "Aborted (resumable)";
          } else {
            log(`Download failed: ${e.message}`, true);
            $("progLabel").textContent = `Failed: ${e.message}`;
          }
        } finally {
          abortCtl = null;
          updateDownloadButtons();
        }
      }

      $("btnDownloadSel").onclick = () => runDownload(selectedPaths());
      $("btnDownloadAll").onclick = () => runDownload(["data"]);
      $("btnAbort").onclick = () => abortCtl?.abort();

      /* Capability and guidance both come from the SDK now, so every consumer
       * says the same accurate thing: it owns the awkward facts (Android serves
       * Web Serial for RFCOMM only; iOS cannot reach classic Bluetooth at any
       * layer) and returns null when a link simply works. */
      if (!support.webBluetooth) {
        const banner = $("fwBanner");
        banner.className = "banner err";
        banner.textContent = transportAdvice(support, "ble");
        $("btnConnect").disabled = true;
      }
      /* The classic-Bluetooth button rides Web Serial - it opens the serial port
       * the pairing creates - so it gates on that, not on Web Bluetooth.
       * setConnected() re-applies both floors on every state change; this is the
       * initial application, before anything has connected. */
      $("btnConnectBt").disabled = !support.webSerial;
      const btAdvice = transportAdvice(support, "classicBluetooth");
      if (btAdvice) log(btAdvice, !support.webSerial);
      if (!("showDirectoryPicker" in window)) {
        log(
          "File System Access API unavailable — destination picking will not work in this browser.",
          true,
        );
      } else if (IS_WINDOWS) {
        $("pathHint").textContent = CONSENSYS_BACKUP_HINT;
      }

      // Restore the folder chosen on a previous visit. Access is re-confirmed
      // on the first download click rather than now, because the browser only
      // grants permission from a user gesture.
      void (async () => {
        const saved = await recallDest();
        if (saved) {
          destRoot = saved;
          setDestLabel(true);
          log(`Destination folder restored: ${saved.name}`);
        }
        updateDownloadButtons();
      })();
    </script>
  </body>
</html>
